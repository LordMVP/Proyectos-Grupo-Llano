<script type="text/javascript" id="tplinformacioncentralriesgo">
	<div>
		<h2>AUTORIZACIÓN PARA EL MANEJO DE INFORMACIÓN ANTE LAS CENTRALES DE RIESGO</h2>
		<p>
			Lea cuidadosamente la siguiente cláusula y pregunte lo que no comprenda.  <br>
			El abajo firmante, en su propio nombre o en nombre de la entidad que representa, declara que la información suministrada es verídica y da su consentimiento expreso e irrevocable a <span><b>{{empresa}}</b> </span>, en adelante <span><b>{{empresa}}</b> </span>, o a quien en el futuro haga sus veces como titular del crédito o servicio solicitado, para: a) Consultar, en cualquier tiempo, en las centrales de riesgo o en cualquier otra base de datos manejada por un operador, toda la información relevante para conocer su desempeño como deudor, su capacidad de pago, la viabilidad para entablar o mantener una relación contractual y en general para la gestión del riesgo financiero y crediticio, esto es, la iniciación, mantenimiento y recuperación de cartera, actividades relacionadas con la prevención del lavado de activos y financiación del terrorismo, y prevención del fraude.b) Reportar a las centrales de riesgo o a cualquier otra base de datos manejada por un operador datos, tratados o sin tratar, sobre el cumplimiento o incumplimiento de sus obligaciones crediticias, sus deberes legales de contenido patrimonial, sus datos de ubicación y contacto, sus solicitudes de crédito así como otros atinentes a sus relaciones comerciales, financieras y en general socioeconómicas que haya entregado o que consten en registros públicos, bases de datos públicas o documentos públicos. El reporte de la mencionada información tendrá como finalidad que los diferentes usuarios realicen actividades relacionadas con la gestión del riesgo financiero y crediticio, esto es, la iniciación, mantenimiento y recuperación de cartera, actividades relacionadas con la prevención del lavado de activos y financiación del terrorismo, prevención del fraude y los demás autorizados por la ley.
		</p>
		<p>
			La autorización anterior no impedirá al abajo firmante o su representada ejercer el derecho a corroborar en cualquier tiempo en <span><b>{{empresa}}</b> </span> o en la central de información de riesgo a la cual se hayan suministrado los datos, que la información suministrada es veraz, completa, exacta y actualizada, y en caso de que no lo sea, a que se deje constancia de su desacuerdo, a exigir la rectificación y a ser informado sobre las correcciones efectuadas. <br>
			En constancia de haber sido suficientemente informado del contenido y alcance de esta autorización se firma a los {{fecha.dia}}  días del mes de {{fecha.mes}} de {{fecha.anio}}.
		</p>
	</div>

		<p>Nombre: <span>{{nombre}}</span></p>

	</div>
