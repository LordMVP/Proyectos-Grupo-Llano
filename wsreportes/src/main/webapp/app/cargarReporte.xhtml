<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">
    <h:head>
        <title>Cargar reporte Jasper</title>
    </h:head>
    <h:body>
        <h:form enctype="multipart/form-data">
            <h:outputLabel for="rutaReporte" value="Ruta del reporte"/>
            <h:inputText id="rutaReporte" value="#{uploadController.rutaReporte}" required="true" requiredMessage="La ruta del reporte es requerida"/>
            <h:outputLabel for="rutaReporte" value="Archivo JRXML"/>
            <h:inputFile value="#{uploadController.reporte}" required="true" requiredMessage="El reporte es requerido"/>
            <h:commandButton action="#{uploadController.cargarReporte()}" value="Cargar reporte"/>
        </h:form>
    </h:body>
</html>
