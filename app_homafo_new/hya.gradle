apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'kotlin-kapt'
apply plugin: 'dagger.hilt.android.plugin'

android {
    compileSdk 32

    defaultConfig {
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
        minSdk 25
        targetSdk 32

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        dataBinding true
    }
}

kapt {
    correctErrorTypes = true
}

dependencies.ext.hilt = {
    delegate = dependencies
    implementation "com.google.dagger:hilt-android:2.42"
    kapt "com.google.dagger:hilt-android-compiler:2.42"
}

dependencies.ext.firebase = {
    implementation 'com.google.firebase:firebase-crashlytics-ktx'
    implementation 'com.google.firebase:firebase-analytics-ktx'
}

dependencies.ext.kotlin = {
    //implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    //implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.1.1"
    //implementation 'androidx.core:core-ktx:1.0.1'
}

dependencies.ext.lifecycle = {
    delegate = dependencies
    implementation 'androidx.lifecycle:lifecycle-common:2.4.1'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.4.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.4.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.4.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
}

dependencies.ext.gson = {
    delegate = dependencies
    implementation 'com.google.code.gson:gson:2.8.6'
}

dependencies.ext.retrofit = {
    delegate = dependencies
    def retrofit = "2.6.0"
    implementation "com.squareup.retrofit2:retrofit:$retrofit"
    implementation "com.squareup.retrofit2:converter-gson:$retrofit"
    implementation 'com.google.code.gson:gson:2.8.6'
    implementation 'com.squareup.okhttp3:okhttp:4.9.2'
}

dependencies.ext.arcgis = {
    delegate = dependencies
    def arcgis = "100.14.0"
    implementation "com.esri.arcgisruntime:arcgis-android:$arcgis"
    implementation "com.esri.arcgisruntime:arcgis-android-toolkit:$arcgis"
}

dependencies.ext.images = {
    delegate = dependencies
    implementation "com.github.yalantis:ucrop:2.2.6"
    implementation 'com.github.dhaval2404:imagepicker:2.1'
    implementation 'com.github.bumptech.glide:glide:4.13.2'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.13.2'
}

dependencies.ext.carousel = {
    delegate = dependencies
    // Circle Indicator (To fix the xml preview "Missing classes" error)
    implementation 'me.relex:circleindicator:2.1.6'
    implementation 'org.imaginativeworld.whynotimagecarousel:whynotimagecarousel:2.1.0'
}

dependencies.ext.sspusage = {
    delegate = dependencies
    implementation 'com.intuit.sdp:sdp-android:1.0.6'
    implementation 'com.intuit.ssp:ssp-android:1.0.6'
}

dependencies.ext.gson = {
    delegate = dependencies
    implementation 'com.google.code.gson:gson:2.8.6'
}

dependencies.ext.material = {
    dependencies.implementation 'com.google.android.material:material:1.7.0-beta01'
    dependencies.implementation 'androidx.constraintlayout:constraintlayout:2.2.0-alpha03'
}

dependencies.ext.appCompat = {
    dependencies.implementation 'androidx.appcompat:appcompat:1.6.1'
}